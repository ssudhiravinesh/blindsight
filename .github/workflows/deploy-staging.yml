name: Deploy Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions to Staging
        run: |
          supabase functions deploy monitor-tos-changes --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_ID }} --access-token ${{ secrets.SUPABASE_ACCESS_TOKEN }} --no-verify-jwt
          supabase functions deploy analyze --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_ID }} --access-token ${{ secrets.SUPABASE_ACCESS_TOKEN }} --no-verify-jwt
          supabase functions deploy get-notifications --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_ID }} --access-token ${{ secrets.SUPABASE_ACCESS_TOKEN }} --no-verify-jwt
          supabase functions deploy health --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_ID }} --access-token ${{ secrets.SUPABASE_ACCESS_TOKEN }} --no-verify-jwt
          supabase functions deploy register-device --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_ID }} --access-token ${{ secrets.SUPABASE_ACCESS_TOKEN }} --no-verify-jwt
          supabase functions deploy track-service --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_ID }} --access-token ${{ secrets.SUPABASE_ACCESS_TOKEN }} --no-verify-jwt
