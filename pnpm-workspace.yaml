packages:
  - 'packages/*'
allowBuilds:
  esbuild: true
# Force patched versions of vulnerable transitive dependencies (see `pnpm audit`).
overrides:
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
  postcss-selector-parser: '^6.1.5'
  '@typescript-eslint/typescript-estree>minimatch': '^11.0.1'
  'eslint>minimatch': '^11.0.1'
  '@eslint/config-array>minimatch': '^11.0.1'
